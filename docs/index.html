<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mount Angel Abbey Library — Alvar Aalto Drawings &amp; Vector Reconstruction</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <h1>Mount Angel Abbey Library</h1>
            <p class="subtitle">Alvar Aalto (1970) — Constructive Vector Overlays &amp; IngeTrazo 3D Reconstruction</p>
        </div>
        <div class="controls">
            <a href="library-3d.html" class="viewer-3d-btn" title="Open Interactive IngeTrazo 3D Model">
                &#9670; Interactive 3D Model
            </a>
            <button id="calibratedOnlyBtn" class="calibrated-filter-btn" type="button">
                &#10022; Vector Calibrated (7)
            </button>
            <div class="search-wrap">
                <input type="text" id="searchInput" placeholder="Search title or contents...">
            </div>
            <div class="filter-wrap">
                <select id="typeFilter">
                    <option value="all">All Types</option>
                    <!-- Options populated by JS -->
                </select>
            </div>
            <div class="sort-wrap">
                <select id="sortSelect">
                    <option value="id_asc">Sort by ID (Asc)</option>
                    <option value="id_desc">Sort by ID (Desc)</option>
                    <option value="type_asc">Sort by Type</option>
                </select>
            </div>
        </div>
    </header>

    <main class="gallery-container">
        <div id="galleryGrid" class="grid">
            <!-- Cards populated by JS -->
        </div>
    </main>

    <!-- Modal for full size image -->
    <div id="imageModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <button id="prevBtn" class="nav-btn left-btn">&lsaquo;</button>
            <button id="nextBtn" class="nav-btn right-btn">&rsaquo;</button>

            <div class="modal-header-tools">
                <label class="switch">
                    <input type="checkbox" id="editModeToggle">
                    <span class="slider round"></span>
                </label>
                <span>Edit Mode</span>
            </div>

            <!-- College-Geometry-Style Constructive Vector Control Bar -->
            <div id="vectorOverlayBar" class="vector-control-bar" style="display: none;">
                <label class="vec-master-toggle">
                    <input type="checkbox" id="vecMasterCheck" checked>
                    <span>&#10022; Vectors</span>
                </label>
                <div class="vec-divider"></div>
                <div id="vecLayerPills" class="vec-layer-pills">
                    <!-- Populated from overlays/manifest.json -->
                </div>
                <div class="vec-divider"></div>
                <label class="vec-dark-toggle" title="Invert scan to dark architectural blueprint mode">
                    <input type="checkbox" id="vecDarkBlueprintCheck" checked>
                    <span>Dark Blueprint</span>
                </label>
                <label class="vec-opacity-wrap" title="Dim low-resolution raster scan to inspect pure extracted vectors">
                    <span>Scan</span>
                    <input type="range" id="scanOpacitySlider" min="0" max="100" value="78">
                    <span id="scanOpacityVal">78%</span>
                </label>
            </div>

            <div id="editorToolbar" class="editor-toolbar" style="display: none;">
                <button id="toolBox" class="tool-btn active">Draw Bounding Box</button>
                <button id="toolPoint" class="tool-btn">Set Reference Point</button>
                <div style="width: 1px; background: rgba(255,255,255,0.2); margin: 0 0.5rem;"></div>
                <button id="exportBtn" class="action-btn" style="padding: 0.3rem 0.8rem; font-size: 0.85rem;">Export JSON</button>
            </div>

            <div class="canvas-container" id="canvasContainer">
                <img id="modalImage" src="" alt="Full Drawing" draggable="false">
                <div id="vectorSvgLayer" class="vector-svg-layer"></div>
                <div id="annotationsLayer" class="annotations-layer"></div>
                <!-- Drawing overlay specifically for mouse interactions -->
                <div id="drawingOverlay" class="drawing-overlay" style="display: none;"></div>
            </div>

            <div id="modalCaption" class="modal-caption"></div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
